    <style rel="stylesheet" crossorigin>:root{--bg: #0b0e14;--panel: #121722;--panel-2: #0e131c;--line: #223047;--ink: #d7e0ee;--ink-dim: #7c8aa5;--accent: #ffb454;--accent-2: #4ea1ff;--ok: #7ee08a;--error: #ff6b6b;--mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.5}body{background-image:radial-gradient(circle at 15% -10%,#16202f 0%,transparent 45%),radial-gradient(circle at 100% 0%,#141b28 0%,transparent 40%);min-height:100vh}.app{max-width:640px;margin:0 auto;padding:28px 20px 48px}.masthead{display:flex;align-items:center;gap:16px;padding-bottom:20px;border-bottom:1px solid var(--line)}.mark{position:relative;width:44px;height:44px;flex:0 0 auto;border:1px solid var(--line);background:var(--panel-2);border-radius:6px}.mark__dot{position:absolute;top:9px;left:9px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent)}.mark__lines{position:absolute;left:9px;right:9px;bottom:10px;height:3px;background:var(--ink-dim);box-shadow:0 6px 0 -1px var(--ink-dim),0 11px 0 -1px var(--line)}.install{margin-left:auto;align-self:center;padding:8px 14px;background:transparent;color:var(--accent);border:1px solid var(--accent);border-radius:6px;font-family:inherit;font-size:12px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:background .15s,color .15s}.install:hover{background:var(--accent);color:var(--bg)}.install:disabled{opacity:.5;cursor:default}.masthead__text h1{margin:0;font-size:20px;letter-spacing:4px;font-weight:700}.tagline{margin:2px 0 0;color:var(--ink-dim);font-size:12px;letter-spacing:1px}.tabs{display:flex;gap:6px;margin:22px 0 18px}.tab{flex:1;padding:10px 14px;background:var(--panel-2);color:var(--ink-dim);border:1px solid var(--line);border-radius:6px;font-family:inherit;font-size:13px;letter-spacing:2px;text-   <body>
    <main id="app" class="app">
      <header class="masthead">
        <div class="mark" aria-hidden="true">
          <span class="mark__dot"></span>
          <span class="mark__lines"></span>
        </div>
        <div class="masthead__text">
          <h1>STEGANOGRAPH</h1>
          <p class="tagline">conceal · encrypt · reveal — offline</p>
        </div>
      </header>

      <nav class="tabs" role="tablist">
        <button id="tab-hide" class="tab tab--active" role="tab" aria-selected="true">
          Hide
        </button>
        <button id="tab-reveal" class="tab" role="tab" aria-selected="false">Reveal</button>
      </nav>

      <!-- HIDE -->
      <section id="panel-hide" class="panel" role="tabpanel">
        <label class="field">
          <span class="field__label">Carrier image (PNG or any decodable image)</span>
          <input id="hide-image" type="file" accept="image/*" />
        </label>
        <p id="hide-capacity" class="hint">Load an image to see its capacity.</p>

        <label class="field">
          <span class="field__label">Secret message</span>
          <textarea id="hide-message" rows="4" placeholder="Type the message to conceal…"></textarea>
        </label>

        <label class="field">
          <span class="field__label">Password (optional — enables AES-GCM encryption)</span>
          <input id="hide-password" type="password" autocomplete="new-password" placeholder="leave blank to embed as plaintext" />
        </label>

        <button id="hide-run" class="action">Embed &amp; download PNG</button>
        <p id="hide-status" class="status" role="status"></p>
        <canvas id="hide-canvas" hidden></canvas>
      </section>

      <!-- REVEAL -->
      <section id="panel-reveal" class="panel" hidden role="tabpanel">
        <label class="field">
          <span class="field__label">Stego image (must be a lossless PNG)</span>
          <input id="reveal-image" type="file" accept="image/*" />
        </label>

        <label class="field">
          <span class="field__label">Password (if the message is encrypted)</span>
          <input id="reveal-password" type="password" autocomplete="off" />
        </label>

        <button id="reveal-run" class="action">Reveal message</button>
        <p id="reveal-status" class="status" role="status"></p>
        <label class="field" hidden id="reveal-output-field">
          <span class="field__label">Revealed message</span>
          <textarea id="reveal-output" rows="4" readonly></textarea>
        </label>
        <canvas id="reveal-canvas" hidden></canvas>
      </section>

      <footer class="footer">
        <p>
          Everything runs in your browser. No pixel and no password ever leaves this
          device. Share only <strong>PNG</strong> — recompression (JPEG, messengers)
          destroys the hidden bits.
        </p>
      </footer>
    </main>
  </body>
</html>
